name: spot_drop
description: "SpotDrop — Geofencing-based task manager. Location-aware reminders, 100% offline-first."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.7

  # Functional Error Handling
  dartz: ^0.10.1

  # Local Database (Offline-First)
  isar: ^3.1.0+1
  isar_flutter_libs: ^3.1.0+1

  # Dependency Injection
  get_it: ^8.0.2

  # Maps
  flutter_map: ^7.0.2
  latlong2: ^0.9.1

  # Permissions
  permission_handler: ^11.3.1

  # Notifications
  flutter_local_notifications: ^18.0.1

  # Path Provider
  path_provider: ^2.1.4

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0

  # Animations & UI
  flutter_animate: ^4.5.2
  lottie: ^3.1.2
  
  # Search & Geocoding
  geocoding: ^3.0.0
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  isar_generator: ^3.1.0+1
  build_runner: ^2.4.13
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon_base.png"
  min_sdk_android: 21

flutter_native_splash:
  color: "#0D0D0D"
  image: "assets/images/app_icon_base.png"
  ios: true
  android: true
  fullscreen: true

flutter:
  uses-material-design: true

  assets:
    - assets/images/app_icon_base.png

  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Inter-Bold.ttf
          weight: 700
